<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" width="720" height="720" role="img" aria-label="Animated neon illustration of a developer in a hoodie and headphones coding on a laptop">
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#0F4A38" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#07241C" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#121212" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hoodie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#123F33"/>
      <stop offset="100%" stop-color="#061814"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CE9169"/>
      <stop offset="100%" stop-color="#8F5A3D"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A382E"/>
      <stop offset="100%" stop-color="#07130F"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A211B"/>
      <stop offset="100%" stop-color="#04100C"/>
    </linearGradient>
    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="lensL"><rect x="286" y="286" width="72" height="56" rx="16"/></clipPath>
    <clipPath id="lensR"><rect x="374" y="286" width="72" height="56" rx="16"/></clipPath>
    <clipPath id="screenClip"><rect x="235" y="520" width="250" height="128" rx="10"/></clipPath>
  </defs>

  <rect width="720" height="720" fill="none"/>
  <circle cx="360" cy="300" r="292" fill="url(#glow)"/>

  <!-- faint grid -->
  <g stroke="#58E7B4" stroke-width="1" opacity="0.06">
    <path d="M40 120H680M40 240H680M40 360H680M40 480H680M40 600H680"/>
    <path d="M120 40V680M240 40V680M360 40V680M480 40V680M600 40V680"/>
  </g>

  <!-- ambient binary rain -->
  <g font-family="monospace" font-size="13" fill="#58E7B4" opacity="0.22">
    <text x="56" y="190">01<tspan x="56" dy="20">10</tspan><tspan x="56" dy="20">11</tspan><tspan x="56" dy="20">00</tspan><tspan x="56" dy="20">01</tspan></text>
    <text x="640" y="150">10<tspan x="640" dy="20">01</tspan><tspan x="640" dy="20">00</tspan><tspan x="640" dy="20">11</tspan><tspan x="640" dy="20">10</tspan></text>
    <text x="78" y="480">11<tspan x="78" dy="20">00</tspan><tspan x="78" dy="20">10</tspan></text>
    <text x="620" y="450">01<tspan x="620" dy="20">11</tspan><tspan x="620" dy="20">10</tspan></text>
  </g>

  <!-- floating terminal card -->
  <g transform="translate(58 132)">
    <animateTransform attributeName="transform" type="translate" values="58 132; 58 122; 58 132" dur="6s" repeatCount="indefinite"/>
    <rect width="148" height="92" rx="10" fill="#081B15" stroke="#58E7B4" stroke-opacity="0.55"/>
    <rect width="148" height="22" rx="10" fill="#58E7B4" opacity="0.12"/>
    <circle cx="14" cy="11" r="3.4" fill="#58E7B4" opacity="0.8"/>
    <circle cx="26" cy="11" r="3.4" fill="#58E7B4" opacity="0.45"/>
    <circle cx="38" cy="11" r="3.4" fill="#58E7B4" opacity="0.25"/>
    <text x="14" y="45" font-family="monospace" font-size="12" fill="#9BF7D4" opacity="0.95">rag.init()</text>
    <text x="14" y="63" font-family="monospace" font-size="12" fill="#9BF7D4" opacity="0.6">faiss.index</text>
    <text x="14" y="81" font-family="monospace" font-size="12" fill="#58E7B4">▸ online</text>
    <rect x="86" y="73" width="8" height="11" fill="#58E7B4">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- floating AI chip -->
  <g transform="translate(536 178)">
    <animateTransform attributeName="transform" type="translate" values="536 178; 536 168; 536 178" dur="5s" repeatCount="indefinite"/>
    <rect x="0" y="0" width="92" height="92" rx="14" fill="#081B15" stroke="#58E7B4" stroke-opacity="0.55"/>
    <rect x="14" y="14" width="64" height="64" rx="10" fill="#0D2B23" stroke="#58E7B4" stroke-opacity="0.5"/>
    <text x="46" y="55" text-anchor="middle" font-family="monospace" font-size="24" font-weight="700" fill="#7DF3C8">AI</text>
    <circle cx="46" cy="4" r="3" fill="#58E7B4">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- figure -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="7s" repeatCount="indefinite"/>

    <!-- shoulders / hoodie -->
    <path d="M170 720 C176 556 232 482 306 458 L414 458 C490 482 548 556 554 720 Z" fill="url(#hoodie)" stroke="#58E7B4" stroke-opacity="0.3" stroke-width="2"/>
    <path d="M170 720 C176 556 232 482 306 458" fill="none" stroke="#58E7B4" stroke-width="2" opacity="0.55"/>
    <path d="M554 720 C548 556 490 482 414 458" fill="none" stroke="#58E7B4" stroke-width="2" opacity="0.22"/>

    <!-- hood collar -->
    <path d="M276 466 C296 502 326 520 360 520 C394 520 424 502 444 466 C438 442 404 428 360 428 C316 428 282 442 276 466 Z" fill="#0B2A22"/>
    <path d="M276 466 C296 502 326 520 360 520 C394 520 424 502 444 466" fill="none" stroke="#58E7B4" stroke-width="2.5" opacity="0.85"/>

    <!-- chest code badge -->
    <g transform="translate(360 620)" opacity="0.95" filter="url(#neon)">
      <path d="M-34 -14 L-46 0 L-34 14" fill="none" stroke="#7DF3C8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M34 -14 L46 0 L34 14" fill="none" stroke="#7DF3C8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M8 -20 L-8 20" fill="none" stroke="#7DF3C8" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- neck -->
    <path d="M330 404 L390 404 L390 450 C390 468 330 468 330 450 Z" fill="#8A563A"/>
    <path d="M330 410 C345 424 375 424 390 410 L390 438 C375 452 345 452 330 438 Z" fill="#6B3E29" opacity="0.65"/>

    <!-- ears -->
    <ellipse cx="262" cy="320" rx="17" ry="27" fill="#9C6444"/>
    <ellipse cx="458" cy="320" rx="17" ry="27" fill="#9C6444"/>

    <!-- face -->
    <path d="M268 300 C268 224 310 186 360 186 C410 186 452 224 452 300 C452 368 414 414 360 414 C306 414 268 368 268 300 Z" fill="url(#skin)"/>

    <!-- hair -->
    <path d="M260 306 C250 228 286 170 358 168 C428 166 468 212 462 292 C452 250 430 228 396 222 C416 238 420 250 418 262 C398 236 366 224 334 228 C300 232 276 252 268 282 C266 294 266 302 260 306 Z" fill="url(#hair)"/>
    <path d="M386 194 C412 196 432 210 444 232 C426 220 406 212 386 210 Z" fill="#2C5546" opacity="0.55"/>

    <!-- eyebrows -->
    <path d="M294 278 C306 270 324 270 336 276" fill="none" stroke="#0F2A22" stroke-width="5" stroke-linecap="round"/>
    <path d="M384 276 C396 270 414 270 426 278" fill="none" stroke="#0F2A22" stroke-width="5" stroke-linecap="round"/>

    <!-- eyes -->
    <g fill="#0B1A15">
      <ellipse cx="322" cy="302" rx="6.5" ry="7.5">
        <animate attributeName="ry" values="7.5;7.5;1;7.5;7.5" keyTimes="0;0.86;0.9;0.94;1" dur="6.5s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="398" cy="302" rx="6.5" ry="7.5">
        <animate attributeName="ry" values="7.5;7.5;1;7.5;7.5" keyTimes="0;0.86;0.9;0.94;1" dur="6.5s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <!-- glasses -->
    <g fill="rgba(88,231,180,0.12)" stroke="#58E7B4" stroke-width="5">
      <rect x="286" y="286" width="72" height="56" rx="16"/>
      <rect x="374" y="286" width="72" height="56" rx="16"/>
    </g>
    <path d="M358 306 C364 302 368 302 374 306" fill="none" stroke="#58E7B4" stroke-width="4" stroke-linecap="round"/>
    <path d="M286 300 L270 296" stroke="#58E7B4" stroke-width="4" stroke-linecap="round"/>
    <path d="M446 300 L462 296" stroke="#58E7B4" stroke-width="4" stroke-linecap="round"/>
    <g clip-path="url(#lensL)">
      <rect x="272" y="270" width="24" height="90" fill="#BFFFE6" opacity="0.28" transform="rotate(18 284 315)">
        <animate attributeName="x" values="262; 344; 344" keyTimes="0;0.55;1" dur="5.4s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g clip-path="url(#lensR)">
      <rect x="360" y="270" width="24" height="90" fill="#BFFFE6" opacity="0.28" transform="rotate(18 372 315)">
        <animate attributeName="x" values="350; 432; 432" keyTimes="0;0.55;1" dur="5.4s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- nose and smile -->
    <path d="M356 322 C352 334 350 340 360 344" fill="none" stroke="#7C4A32" stroke-width="4" stroke-linecap="round"/>
    <path d="M336 368 C350 379 370 379 384 368" fill="none" stroke="#5F3524" stroke-width="5" stroke-linecap="round"/>

    <!-- headphones -->
    <path d="M258 300 C250 210 300 158 360 158 C420 158 470 210 462 300" fill="none" stroke="#58E7B4" stroke-width="18" stroke-linecap="round" opacity="0.85"/>
    <path d="M258 300 C250 210 300 158 360 158 C420 158 470 210 462 300" fill="none" stroke="#0B2A22" stroke-width="7" stroke-linecap="round"/>
    <rect x="236" y="288" width="42" height="78" rx="18" fill="#0D2B23" stroke="#58E7B4" stroke-opacity="0.6"/>
    <rect x="442" y="288" width="42" height="78" rx="18" fill="#0D2B23" stroke="#58E7B4" stroke-opacity="0.6"/>
    <rect x="244" y="300" width="12" height="54" rx="6" fill="#58E7B4" opacity="0.85" filter="url(#neon)">
      <animate attributeName="opacity" values="0.35;0.9;0.35" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="464" y="300" width="12" height="54" rx="6" fill="#58E7B4" opacity="0.6"/>

    <!-- laptop lid -->
    <g>
      <rect x="228" y="508" width="264" height="144" rx="14" fill="#0A2620" stroke="#58E7B4" stroke-opacity="0.45"/>
      <rect x="235" y="520" width="250" height="128" rx="10" fill="url(#screen)"/>
      <g clip-path="url(#screenClip)" font-family="monospace" font-size="12">
        <text x="250" y="543" fill="#58E7B4" opacity="0.9">// dataforge · study assistant</text>
        <text x="250" y="562" fill="#8FB8A8" opacity="0.75">load(pdf) → chunks → embed</text>
        <text x="250" y="581" fill="#E8FFF6" opacity="0.9">retrieve(query, k=4)</text>
        <text x="250" y="600" fill="#8FB8A8" opacity="0.7">groq.chat(context)</text>
        <text x="250" y="619" fill="#58E7B4" opacity="0.95">✓ answer with citations</text>
        <rect x="250" y="629" width="8" height="12" fill="#58E7B4">
          <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1s" repeatCount="indefinite"/>
        </rect>
        <g opacity="0.55">
          <rect x="400" y="537" width="66" height="5" rx="2.5" fill="#58E7B4">
            <animate attributeName="width" values="20;66;66;20" keyTimes="0;0.4;0.8;1" dur="4s" repeatCount="indefinite"/>
          </rect>
          <rect x="400" y="550" width="44" height="5" rx="2.5" fill="#E8FFF6" opacity="0.6"/>
          <rect x="400" y="563" width="58" height="5" rx="2.5" fill="#E8FFF6" opacity="0.35"/>
        </g>
      </g>
      <circle cx="360" cy="512" r="2.5" fill="#58E7B4" opacity="0.8"/>
    </g>

    <!-- hands -->
    <path d="M286 656 C278 632 292 618 310 620 C326 622 334 638 330 656 Z" fill="url(#skin)"/>
    <path d="M434 656 C442 632 428 618 410 620 C394 622 386 638 390 656 Z" fill="url(#skin)"/>
    <path d="M298 630 L300 646 M310 628 L312 646 M322 630 L322 646" stroke="#6B3E29" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <path d="M422 630 L420 646 M410 628 L408 646 M398 630 L398 646" stroke="#6B3E29" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

    <!-- laptop base / keyboard -->
    <path d="M186 652 L534 652 L566 700 L154 700 Z" fill="#0C2B23" stroke="#58E7B4" stroke-opacity="0.3"/>
    <path d="M206 660 L514 660 L530 686 L190 686 Z" fill="#051410"/>
    <g stroke="#58E7B4" stroke-width="2" opacity="0.3">
      <path d="M214 668H506M206 676H514"/>
    </g>
  </g>

  <!-- floating code marks -->
  <g font-family="monospace" font-weight="700" fill="#58E7B4" opacity="0.7">
    <text x="108" y="356" font-size="26">&lt;/&gt;</text>
    <text x="586" y="330" font-size="24">{ }</text>
    <text x="530" y="606" font-size="18" opacity="0.6">01</text>
  </g>

  <!-- sparkles -->
  <g fill="#58E7B4">
    <circle cx="196" cy="238" r="3">
      <animate attributeName="opacity" values="0.1;1;0.1" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="574" cy="424" r="2.5">
      <animate attributeName="opacity" values="1;0.1;1" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="516" cy="108" r="2.5">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
