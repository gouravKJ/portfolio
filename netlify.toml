[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/traffic"
  to = "/.netlify/functions/traffic"
  status = 200

[[redirects]]
  from = "/api/github"
  to = "/.netlify/functions/github"
  status = 200

[[redirects]]
  from = "/api/repo"
  to = "/.netlify/functions/repo"
  status = 200
